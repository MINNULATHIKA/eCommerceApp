<div class="container">
	<div class="row">
		<div class="col-2">
			<h5>Category</h5>
			@for (item of categoryList | async; track $index) {
				<button class="btn btn-success mt-2" (click)="getAllProductsByCategoryId(item.categoryId)">{{item.categoryName}}</button>
			}
		</div>
		<div class="col-10">
			<div class="row">
				@for (item of productList(); track $index) {
				<div class="col-3 pt-2">
					<div class="card product-card">
						@if (item.productImageUrl == '' || item.productImageUrl == null) {
						<svg aria-label="Placeholder: Thumbnail" class="card-img-top product-image" height="100px"
							preserveAspectRatio="xMidYMid slice" role="img" width="100%"
							xmlns="http://www.w3.org/2000/svg">
							<title>No Image Found</title>
							<rect width="100%" height="100%" fill="#55595c"></rect><text x="50%" y="50%" fill="#eceeef"
								dy=".3em">No Image Found</text>
						</svg>
						}
						@else{
						<img class="card-img-top product-image" [src]="item.productImageUrl" alt="">
						}
						<span class="category-badge">{{item.categoryName}}</span>
						<div class="card-body">
							<h5 class="card-title">{{item.productName}}</h5>
							<p class="product-price">{{'$3'}}{{item.productPrice}}</p>
							<div class="d-flex justify-content-between align-items-center">
								<button type="button" class="btn add-to-cart-btn"
									(click)="addToCart(item.productId)">Add to Cart</button>
							</div>
						</div>
					</div>
				</div>
				}
			</div>
		</div>
	</div>


</div>
